{{template "base" .}}

{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Сброс пароля</h2>
                <p class="text-muted text-center mb-4">
                    Введите новый пароль для вашего аккаунта
                </p>
                
                <form method="POST" action="/reset-password" class="needs-validation" novalidate>
                    <input type="hidden" name="token" value="{{.Token}}">
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Новый пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                        <div class="invalid-feedback">
                            Пароль должен содержать минимум 6 символов
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Подтвердите пароль</label>
                        <input type="password" class="form-control" id="confirm_password" required minlength="6">
                        <div class="invalid-feedback">
                            Пароли должны совпадать
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-key"></i> Сбросить пароль
                    </button>
                </form>

                <div class="text-center">
                    <p class="mb-0">
                        <a href="/login">Вернуться к входу</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Password confirmation validation
document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        e.preventDefault();
        document.getElementById('confirm_password').setCustomValidity('Пароли не совпадают');
        document.getElementById('confirm_password').classList.add('is-invalid');
    } else {
        document.getElementById('confirm_password').setCustomValidity('');
    }
});

document.getElementById('confirm_password').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    if (this.value === password) {
        this.setCustomValidity('');
        this.classList.remove('is-invalid');
    }
});
</script>
{{end}}
