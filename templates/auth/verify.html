{{template "base" .}}

{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-check" style="font-size: 3rem; color: #3498db;"></i>
                    <h2 class="mt-3">Двухфакторная аутентификация</h2>
                    <p class="text-muted">Мы отправили код подтверждения на ваш email</p>
                </div>
                
                <form method="POST" action="/verify" class="needs-validation" novalidate>
                    <input type="hidden" name="email" value="{{.Email}}">
                    
                    <div class="mb-4">
                        <label for="code" class="form-label text-center d-block">Введите 6-значный код</label>
                        <input type="text" class="form-control verification-code-input text-center" 
                               id="code" name="code" required pattern="[0-9]{6}" maxlength="6"
                               placeholder="000000">
                        <div class="invalid-feedback text-center">
                            Код должен содержать 6 цифр
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-check-circle"></i> Подтвердить
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-muted small">
                        <i class="bi bi-clock"></i> Код действителен 10 минут
                    </p>
                    <p class="mb-0">
                        <a href="/login">Вернуться к входу</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
