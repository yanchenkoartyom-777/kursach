{{template "admin" .}}

{{define "content"}}
<h1 class="mb-4">Dashboard</h1>

<div class="row">
    <div class="col-md-3 mb-4">
        <div class="card stat-card">
            <div class="card-body">
                <h6 class="text-muted">Всего заказов</h6>
                <h2>{{.Stats.TotalOrders}}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-4">
        <div class="card stat-card">
            <div class="card-body">
                <h6 class="text-muted">Выручка</h6>
                <h2>${{printf "%.2f" .Stats.TotalRevenue}}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-4">
        <div class="card stat-card">
            <div class="card-body">
                <h6 class="text-muted">Средний чек</h6>
                <h2>${{printf "%.2f" .Stats.AverageOrder}}</h2>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5>Топ автомобилей</h5></div>
            <div class="card-body">
                <canvas id="topCarsChart"></canvas>
            </div>
        </div>
    </div>
</div>
{{end}}
